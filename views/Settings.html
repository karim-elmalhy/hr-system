<div class="p-6 max-w-7xl mx-auto space-y-8 animate-fade-in">
  
  <div class="flex flex-col md:flex-row justify-between items-end border-b border-gray-200 pb-4 gap-4">
    <div>
      <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
        <span>👤</span> الملف الشخصي
      </h2>
      <p class="text-gray-500 mt-1">إدارة بيانات حسابك الشخصي</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center">
      <div class="w-24 h-24 bg-virginia-100 text-virginia-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 border-4 border-white shadow-lg">
        👋
      </div>
      <h3 class="text-xl font-bold text-gray-800" id="profile-name">جاري التحميل...</h3>
      <p class="text-sm text-gray-500 mb-4" id="profile-role">...</p>
      
      <div class="bg-gray-50 rounded-xl p-3 text-right space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-500">اسم المستخدم:</span>
          <span class="font-bold text-gray-800 dir-ltr" id="profile-username">...</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">الكود الوظيفي:</span>
          <span class="font-bold text-gray-800" id="profile-code">...</span>
        </div>
      </div>
    </div>

    <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>🔒</span> تغيير كلمة المرور
      </h3>
      <form onsubmit="changeMyPassword(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور الحالية</label>
          <div class="relative">
             <input type="password" id="old-pass" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-virginia-500 outline-none transition">
             <button type="button" onclick="togglePassVisibility('old-pass')" class="absolute left-3 top-3 text-gray-400 hover:text-gray-600">👁️</button>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور الجديدة</label>
            <div class="relative">
              <input type="password" id="new-pass" required minlength="4" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-virginia-500 outline-none transition">
              <button type="button" onclick="togglePassVisibility('new-pass')" class="absolute left-3 top-3 text-gray-400 hover:text-gray-600">👁️</button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">تأكيد الجديدة</label>
            <input type="password" id="confirm-pass" required minlength="4" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-virginia-500 outline-none transition">
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button type="submit" id="btn-change-pass" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg transition">
            حفظ كلمة المرور
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="admin-sections-container" class="hidden space-y-8">
    
    <div class="flex flex-col md:flex-row justify-between items-end border-b border-gray-200 pb-4 gap-4 mt-8">
      <div>
        <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
          <span>⚙️</span> إعدادات النظام
        </h2>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
        <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg text-lg">🎨</span>
        المظهر العام
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">اسم النظام / الشركة</label>
          <input type="text" id="setting-app-name" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="مثال: Smart HR Panel">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">لون النظام (Theme)</label>
          <div class="flex items-center gap-4">
            <div class="relative group cursor-pointer w-16 h-16">
              <input type="color" id="setting-theme-color" oninput="previewColor(this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
              <div id="color-preview-circle" class="w-full h-full rounded-full shadow-md border-4 border-white ring-2 ring-gray-200 transition-transform transform group-hover:scale-105" style="background-color: #4f46e5;"></div>
            </div>
            <div class="mt-3 flex items-center gap-2">
              <input type="checkbox" id="setting-sidebar-gradient" onchange="toggleSidebarGradient()" class="rounded text-indigo-600 focus:ring-indigo-500">
              <label for="setting-sidebar-gradient" class="text-sm text-gray-700 font-bold cursor-pointer">
                تفعيل التدرج في القائمة الجانبية (Gradient Sidebar)
              </label>
            </div>
            <div class="flex flex-col">
              <span id="color-code-display" class="text-lg font-mono font-bold text-gray-600">#4f46e5</span>
              <span class="text-xs text-gray-400">اضغط لتغيير اللون</span>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-8 flex justify-end border-t pt-4">
        <button onclick="saveGeneralSettings()" id="btn-save-general" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg transition flex items-center gap-2">
          <span>💾</span> حفظ التغييرات
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          <span class="bg-green-100 text-green-600 p-1.5 rounded-lg text-lg">🛡️</span>
          إدارة المستخدمين
        </h3>
        <button onclick="openUserModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold shadow transition flex items-center gap-2 text-sm">
          <span>➕</span> إضافة مستخدم
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right">
          <thead class="bg-gray-50 text-gray-600 text-sm uppercase">
            <tr>
              <th class="p-4 rounded-r-xl">اسم المستخدم</th>
              <th class="p-4">الدور</th>
              <th class="p-4">الكود</th>
              <th class="p-4">القسم المسؤول</th>
              <th class="p-4 rounded-l-xl">إجراءات</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="divide-y divide-gray-100 text-sm">
            <tr><td colspan="5" class="text-center p-4">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div> </div>

  <div id="user-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 m-4 max-h-[90vh] overflow-y-auto">
    
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h3 class="text-xl font-bold text-gray-800" id="modal-title">إضافة مستخدم جديد</h3>
      <button type="button" onclick="closeUserModal()" class="text-gray-400 hover:text-red-500 transition text-2xl">×</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">اسم المستخدم</label>
        <input type="text" id="u_username" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-virginia-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور</label>
        <input type="text" id="u_password" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-virginia-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">الدور (Role)</label>
        <select id="u_role" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-virginia-500 outline-none bg-white">
          <option value="Manager">Manager (مدير)</option>
          <option value="Admin">Admin (مسؤول كامل)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">الكود الوظيفي</label>
        <input type="number" id="u_empCode" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-virginia-500 outline-none">
      </div>
    </div>

    <div class="mb-6 bg-blue-50 p-3 rounded-xl border border-blue-100">
      <label class="block text-sm font-bold text-blue-800 mb-1">القسم المسؤول عنه</label>
      <input type="text" id="u_dept" class="w-full p-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
    </div>

    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-700 mb-3">الصلاحيات:</label>
      <div class="grid grid-cols-2 gap-3" id="modal-permissions-grid">
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_dashboard"><span class="text-sm font-bold">📊 لوحة القيادة</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_emp_view"><span class="text-sm font-bold">👥 عرض الموظفين</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_emp_edit"><span class="text-sm font-bold">✏️ تعديل البيانات</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_penalties"><span class="text-sm font-bold">⚖️ إدارة الجزاءات</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_settings"><span class="text-sm font-bold">⚙️ إعدادات النظام</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_interview"><span class="text-sm font-bold">🤝 منصة التوظيف</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_leaves"><span class="text-sm font-bold">🏖️ إدارة الإجازات</span></label>
         <label class="flex items-center gap-2 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="perm_docs"><span class="text-sm font-bold">📂 مركز النماذج</span></label>
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t">
      <button type="button" onclick="closeUserModal()" class="px-6 py-2 rounded-lg font-bold text-gray-500 hover:bg-gray-100 transition">إلغاء</button>
      <button type="button" onclick="saveUser()" id="btn-save-user" class="px-6 py-2 rounded-lg font-bold bg-virginia-600 text-white hover:bg-virginia-700 shadow-lg transition">حفظ المستخدم</button>
    </div>

  </div>
  </div>
</div>
